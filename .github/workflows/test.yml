name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: unit tests (mocked DB, no real Postgres)
        run: go test -v -race ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: integration tests (real Postgres)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse?sslmode=disable
        run: go test -v -race -tags=integration ./...

      - name: build
        run: go build ./...

  e2e:
    name: e2e tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse?sslmode=disable
      BASE_URL: http://localhost:8080
      PORT: 8080
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: apply schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d linkpulse -f schema.sql

      - name: install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: run e2e tests
        working-directory: e2e
        run: npm run test:e2e

      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  build-and-push:
    name: build and push image
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # required to mint the OIDC token WIF exchanges for GCP credentials
    steps:
      - uses: actions/checkout@v7

      # Workload Identity Federation: no long-lived key in GitHub Secrets.
      # GitHub mints a short-lived OIDC token; GCP trusts it only for pushes
      # from chabu-tseng/linkpulse (enforced by the pool provider's
      # attribute-condition, not by anything in this file).
      - name: authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/233179434449/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-deployer@linkpulse-508704.iam.gserviceaccount.com

      - name: set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: configure docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # ubuntu-latest runners are amd64 natively -- this is the exact
      # docker build that failed on my Apple Silicon laptop, but it's fine
      # here since there's no cross-architecture mismatch to hit.
      - name: build image
        run: docker build -t asia-east1-docker.pkg.dev/linkpulse-508704/linkpulse-repo/linkpulse:${{ github.sha }} .

      - name: push image
        run: docker push asia-east1-docker.pkg.dev/linkpulse-508704/linkpulse-repo/linkpulse:${{ github.sha }}

  deploy:
    name: deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # This is the actual "Delivery, not Deployment" gate: GitHub pauses this
    # job here until someone with write access approves it on the Actions
    # tab, no matter how green the jobs above are. Configured once in the
    # repo's Settings -> Environments -> production -> required reviewers.
    environment: production
    permissions:
      contents: write # to commit the updated image tag back to k8s/deployment.yaml
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/233179434449/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-deployer@linkpulse-508704.iam.gserviceaccount.com

      - name: set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: linkpulse-cluster
          location: asia-east1

      - name: update image tag and apply
        run: |
          sed -i "s|linkpulse-repo/linkpulse:[a-f0-9]*|linkpulse-repo/linkpulse:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/linkpulse-api --timeout=120s

      # Keeps k8s/deployment.yaml honest about what's actually running --
      # the same manual step done by hand throughout this project, now
      # automatic. [skip ci] stops this commit from re-triggering the
      # whole workflow (GitHub's own convention, no extra config needed).
      - name: commit the deployed image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "Deploy ${{ github.sha }} [skip ci]"
          git push