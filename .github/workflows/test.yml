name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: unit tests (mocked DB, no real Postgres)
        run: go test -v -race ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: integration tests (real Postgres)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse?sslmode=disable
        run: go test -v -race -tags=integration ./...

      - name: build
        run: go build ./...

  e2e:
    name: e2e tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/linkpulse?sslmode=disable
      BASE_URL: http://localhost:8080
      PORT: 8080
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: apply schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d linkpulse -f schema.sql

      - name: install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: run e2e tests
        working-directory: e2e
        run: npm run test:e2e

      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  build-and-push:
    name: build and push image
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: configure docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: build image
        run: docker build -t asia-east1-docker.pkg.dev/linkpulse-508704/linkpulse-repo/linkpulse:${{ github.sha }} .

      - name: push image
        run: docker push asia-east1-docker.pkg.dev/linkpulse-508704/linkpulse-repo/linkpulse:${{ github.sha }}