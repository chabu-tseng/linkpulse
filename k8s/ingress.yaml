apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkpulse-ingress
  annotations:
    kubernetes.io/ingress.global-static-ip-name: linkpulse-ip
    networking.gke.io/managed-certificates: linkpulse-cert
spec:
  ingressClassName: gce
  rules:
    - host: 34.36.239.115.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkpulse-api-ingress
                port:
                  number: 80
